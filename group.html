<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星环终端 · 内部群聊</title>
    <style>
        :root {
            --gold: #c9a227; --gold-bright: #e8cd6a; --gold-dim: #8a7320;
            --bg: #070709; --panel: #101014; --panel2: #16161c; --line: #2b2b33;
            --text: #d9d9de; --muted: #7d7d88; --orange: #ff9a1f;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
               background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
        .top-bar { display: flex; align-items: center; justify-content: space-between;
                   padding: 12px 22px; background: var(--panel); border-bottom: 1px solid var(--gold-dim); }
        .brand { font-size: 18px; letter-spacing: 6px; color: var(--gold-bright); font-weight: 600; }
        .brand-en { font-size: 10px; letter-spacing: 4px; color: var(--muted); margin-left: 12px; text-transform: uppercase; }
        .top-btns { display: flex; gap: 8px; }
        .top-bar button { background: transparent; border: 1px solid var(--gold-dim); color: var(--gold);
                          padding: 7px 16px; font-size: 12px; letter-spacing: 2px; cursor: pointer; font-family: inherit; }
        .top-bar button:hover { background: var(--gold); color: #000; }
        #msgList { flex: 1; overflow-y: auto; padding: 20px; max-width: 860px; width: 100%; margin: 0 auto; }
        .msg { margin-bottom: 16px; }
        .msg .who { font-size: 13px; font-weight: 600; color: var(--gold); margin-bottom: 4px; letter-spacing: 1px; }
        .msg.me .who { color: var(--gold-bright); }
        .msg.sushi { border-left: 2px solid var(--gold-dim); padding-left: 12px; }
        .msg .body { font-size: 14px; line-height: 1.7; word-break: break-all; white-space: pre-wrap; }
        .msg .at { color: var(--orange); font-weight: 700; }
        .msg .time { font-size: 10px; color: var(--muted); margin-top: 3px; letter-spacing: 1px; }
        .msg .file-btn { display: inline-block; padding: 6px 14px; border: 1px solid var(--gold-dim);
                         color: var(--gold); cursor: pointer; font-size: 13px; }
        .msg .file-btn:hover { background: var(--gold); color: #000; }
        .sys-line { text-align: center; color: var(--muted); font-size: 11px; letter-spacing: 2px; margin: 14px 0; }
        .input-zone { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 20px; position: relative; }
        .input-row { display: flex; gap: 8px; max-width: 860px; margin: 0 auto; align-items: flex-end; }
        #msgInput { flex: 1; padding: 12px; background: var(--panel2); border: 1px solid var(--line);
                    color: var(--text); font-size: 14px; font-family: inherit; outline: none; resize: none; height: 46px; }
        #msgInput:focus { border-color: var(--gold-dim); }
        .icon-btn { padding: 0 16px; height: 46px; background: transparent; border: 1px solid var(--gold-dim);
                    color: var(--gold); cursor: pointer; font-size: 13px; letter-spacing: 1px; font-family: inherit; white-space: nowrap; }
        .icon-btn:hover { background: var(--gold); color: #000; }
        .icon-btn.recording { background: #8a3a2a; border-color: #8a3a2a; color: #fff; }
        #sendBtn { padding: 0 22px; height: 46px; background: var(--gold); border: none; color: #000;
                   font-weight: 600; letter-spacing: 3px; cursor: pointer; font-size: 14px; font-family: inherit; }
        #atDropdown { display: none; position: absolute; bottom: 76px; left: 20px; right: 20px; max-width: 420px;
                      max-height: 180px; overflow-y: auto; background: var(--panel2); border: 1px solid var(--gold-dim); z-index: 50; }
        #atDropdown div { padding: 9px 12px; font-size: 13px; cursor: pointer; }
        #atDropdown div:hover { background: var(--gold); color: #000; }
        .notice { text-align: center; color: #d98a6a; font-size: 13px; padding: 40px; letter-spacing: 2px; }
    </style>
</head>
<body>
    <div class="top-bar">
        <div>
            <span class="brand">内部群聊</span>
            <span class="brand-en">Internal Channel</span>
        </div>
        <div class="top-btns">
            <button onclick="location.href='member.html'">返回工作台</button>
            <button onclick="handleLogout()">退出登录</button>
        </div>
    </div>

    <div id="msgList"><div class="sys-line">载入中…</div></div>

    <div class="input-zone">
        <div id="atDropdown"></div>
        <div class="input-row">
            <textarea id="msgInput" placeholder="输入消息，回车发送。@ 选择成员，@全体成员 通知所有人，@苏轼 询问苏轼" autocomplete="off"></textarea>
            <button class="icon-btn" id="btnVoice">语音</button>
            <button class="icon-btn" id="btnFile">文件</button>
            <button id="sendBtn">发送</button>
        </div>
        <input type="file" id="fileInput" style="display:none">
    </div>

    <script>
        const TEAM_API = "https://1502956590-0kdly2qr1v.ap-nanjing.tencentscf.com";
        let token = localStorage.getItem('xh_token');
        if (!token) location.href = 'member.html';
        let myName = '';
        try { myName = JSON.parse(localStorage.getItem('xh_user') || '{}').username || ''; } catch (e) {}
        let roster = [];
        let lastId = '';
        let recorder = null, recording = false, voiceChunks = [];

        // ★ 退出登录：清缓存回登录页
        function handleLogout() {
            localStorage.removeItem('xh_token');
            localStorage.removeItem('xh_user');
            location.href = 'member.html';
        }

        const CHUNK = 600 * 1024;
        function blobToB64(blob) {
            return new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result.split(',')[1]); r.readAsDataURL(blob); });
        }
        async function uploadAny(file) {
            if (file.size <= CHUNK) {
                const b64 = await blobToB64(file);
                const up = await apiCall('meeting_file_upload', { filename: file.name, content_b64: b64 });
                return { name: up.name, path: up.path };
            }
            if (file.size > 4 * 1024 * 1024) throw new Error('文件超过 4MB，请压缩后上传');
            const n = Math.ceil(file.size / CHUNK);
            const upid = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
            const safeBase = file.name.replace(/[^\w.\-一-龥]/g, '_').slice(0, 40);
            for (let i = 0; i < n; i++) {
                const b64 = await blobToB64(file.slice(i * CHUNK, (i + 1) * CHUNK));
                await apiCall('meeting_file_upload', { filename: `${i}of${n}__${upid}__${safeBase}`, content_b64: b64 });
            }
            return { name: safeBase, path: null, upid: upid, parts: n };
        }
        async function fetchBlob(filePayload) {
            if (!filePayload.upid) {
                const d = await apiCall('meeting_file_download', { path: filePayload.path });
                return b64ToBlob(d.content_b64);
            }
            const d = await apiCall('meeting_file_list');
            const parts = (d.files || []).map(f => ({ f, p: parsePartName(f.name) }))
                .filter(x => x.p && x.p.upid === filePayload.upid).sort((a, b) => a.p.i - b.p.i);
            if (!parts.length) throw new Error('找不到文件分片');
            const arrays = [];
            for (const x of parts) {
                const dd = await apiCall('meeting_file_download', { path: x.f.path });
                arrays.push(b64ToU8(dd.content_b64));
            }
            const total = arrays.reduce((a, b) => a + b.length, 0);
            const all = new Uint8Array(total);
            let off = 0;
            arrays.forEach(a => { all.set(a, off); off += a.length; });
            return new Blob([all]);
        }
        function parsePartName(name) {
            const m = String(name).match(/^(\d+)of(\d+)__(\w+)__/);
            return m ? { i: Number(m[1]), n: Number(m[2]), upid: m[3] } : null;
        }
        function b64ToU8(b64) {
            const bin = atob(b64);
            const arr = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
            return arr;
        }
        function b64ToBlob(b64) { return new Blob([b64ToU8(b64)]); }

        function apiCall(action, dataParams) {
            const body = { action, token };
            if (dataParams) body.data = dataParams;
            return fetch(TEAM_API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
                .then(r => r.json()).then(d => { if (d.error) throw new Error(d.error); return d; });
        }
        function escapeHtml(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
        function highlightAt(s) {
            return escapeHtml(s).replace(/@([A-Za-z0-9_一-龥]+)/g, '<span class="at">@$1</span>');
        }

        function renderMsg(m) {
            const list = document.getElementById('msgList');
            const div = document.createElement('div');
            const cls = m.from === myName ? 'me' : (m.from === '苏轼' ? 'sushi' : '');
            div.className = 'msg ' + cls;
            let bodyHtml = '';
            if (m.type === 'voice' && m.file) {
                bodyHtml = `<span class="file-btn" onclick='playVoice(${JSON.stringify(m.file)})'>播放语音消息</span>`;
            } else if (m.type === 'file' && m.file) {
                bodyHtml = `<span class="file-btn" onclick='downloadFile(${JSON.stringify(m.file)})'>${escapeHtml(m.file.name)}</span>`;
            } else {
                bodyHtml = highlightAt(m.text);
            }
            div.innerHTML = `<div class="who">${escapeHtml(m.from)}${m.mentions && m.mentions.indexOf('ALL') > -1 ? ' <span class="at">@全体成员</span>' : ''}</div>
                             <div class="body">${bodyHtml}</div>
                             <div class="time">${new Date(m.time).toLocaleString()}</div>`;
            list.appendChild(div);
            list.scrollTop = list.scrollHeight;
        }
        function sysLine(text) {
            const list = document.getElementById('msgList');
            const div = document.createElement('div');
            div.className = 'sys-line'; div.innerText = text;
            list.appendChild(div);
        }

        let pollTimer = null;
        async function poll() {
            try {
                const d = await apiCall('group_history');
                const list = document.getElementById('msgList');
                if (d.messages && d.messages.length) {
                    const fresh = d.messages.filter(m => m.id > lastId);
                    if (fresh.length && !lastId) list.innerHTML = '';
                    fresh.forEach(m => {
                        renderMsg(m);
                        if (m.from !== myName && m.mentions &&
                            (m.mentions.indexOf('ALL') > -1 || m.mentions.indexOf(myName) > -1)) {
                            sysLine('【提示】' + m.from + ' 提及了你');
                        }
                    });
                    lastId = d.messages[d.messages.length - 1].id;
                } else if (!lastId) {
                    list.innerHTML = '<div class="sys-line">暂无消息，来说第一句吧</div>';
                }
            } catch (e) {
                if (e.message.indexOf('仅内部成员') > -1) {
                    document.getElementById('msgList').innerHTML = '<div class="notice">该频道仅对内部成员开放</div>';
                    clearInterval(pollTimer);
                }
            }
        }

        async function send(text, type, file, mentions) {
            try { await apiCall('group_send', { text, type: type || 'text', file: file || null, mentions: mentions || extractMentions(text || '') }); }
            catch (e) { sysLine('【发送失败】' + e.message); }
        }
        function extractMentions(text) {
            const ms = [];
            (text.match(/@[A-Za-z0-9_一-龥]+/g) || []).forEach(m => ms.push(m.slice(1)));
            return ms;
        }
        const input = document.getElementById('msgInput');
        function doSend() {
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            document.getElementById('atDropdown').style.display = 'none';
            send(text);
        }
        document.getElementById('sendBtn').onclick = doSend;
        input.addEventListener('keydown', function (e) {
            const dd = document.getElementById('atDropdown');
            if (dd.style.display === 'block' && e.key === 'Enter') { e.preventDefault(); pickAt(dd.querySelector('div')); return; }
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); }
        });

        input.addEventListener('input', function () {
            const dd = document.getElementById('atDropdown');
            const m = input.value.match(/@([A-Za-z0-9_一-龥]*)$/);
            if (!m) { dd.style.display = 'none'; return; }
            const prefix = m[1].toLowerCase();
            const names = ['全体成员', '苏轼'].concat(roster.filter(r => r.username !== myName).map(r => r.username))
                .filter(n => n.toLowerCase().indexOf(prefix) > -1);
            if (!names.length) { dd.style.display = 'none'; return; }
            dd.innerHTML = names.map(n => `<div data-name="${escapeHtml(n)}">@${escapeHtml(n)}</div>`).join('');
            dd.querySelectorAll('div').forEach(d => d.onmousedown = function (ev) { ev.preventDefault(); pickAt(d); });
            dd.style.display = 'block';
        });
        function pickAt(el) {
            if (!el) return;
            input.value = input.value.replace(/@[A-Za-z0-9_一-龥]*$/, '@' + el.dataset.name + ' ');
            document.getElementById('atDropdown').style.display = 'none';
            input.focus();
        }

        document.getElementById('btnVoice').onclick = async function () {
            if (recording) { recorder.stop(); return; }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                recorder = new MediaRecorder(stream);
                voiceChunks = [];
                recorder.ondataavailable = e => voiceChunks.push(e.data);
                recorder.onstop = async function () {
                    stream.getTracks().forEach(t => t.stop());
                    recording = false;
                    document.getElementById('btnVoice').classList.remove('recording');
                    document.getElementById('btnVoice').innerText = '语音';
                    const blob = new Blob(voiceChunks, { type: recorder.mimeType || 'audio/webm' });
                    sysLine('【系统】语音上传中…');
                    try {
                        const up = await uploadAny(new File([blob], 'voice_' + Date.now() + '.webm'));
                        await send('', 'voice', up);
                    } catch (e) { sysLine('【发送失败】' + e.message); }
                };
                recorder.start();
                recording = true;
                this.classList.add('recording');
                this.innerText = '停止';
            } catch (e) { sysLine('【无法录音】' + e.message); }
        };

        document.getElementById('btnFile').onclick = () => document.getElementById('fileInput').click();
        document.getElementById('fileInput').onchange = async function () {
            const f = this.files[0];
            this.value = '';
            if (!f) return;
            sysLine('【系统】文件上传中…');
            try {
                const up = await uploadAny(f);
                await send(f.name, 'file', up);
            } catch (e) { sysLine('【发送失败】' + e.message); }
        };

        async function playVoice(filePayload) {
            try {
                const blob = await fetchBlob(filePayload);
                new Audio(URL.createObjectURL(blob)).play();
            } catch (e) { sysLine('【播放失败】' + e.message); }
        }
        async function downloadFile(filePayload) {
            try {
                const blob = await fetchBlob(filePayload);
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = filePayload.name; a.click();
            } catch (e) { sysLine('【下载失败】' + e.message); }
        }

        (async function init() {
            try {
                const r = await apiCall('internal_roster');
                roster = r.members || [];
            } catch (e) {}
            poll();
            pollTimer = setInterval(poll, 3000);
        })();
    </script>
</body>
</html>
