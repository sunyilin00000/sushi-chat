<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>夜谈 - 与苏轼对话</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: #0a0a0f; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
    .chat-header { padding: 16px; background: #12121a; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
    .header-left h1 { font-size: 18px; color: #d4a574; margin-bottom: 4px; }
    /* ★ 微信级的对方正在输入 */
    .typing-status { font-size: 12px; color: #10b981; height: 16px; display: none; animation: blink 1.5s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    
    .chat-box { flex: 1; overflow-y: auto; padding: 16px; }
    .message { margin-bottom: 16px; max-width: 85%; display: flex; flex-direction: column; }
    .message.user { margin-left: auto; align-items: flex-end; }
    .message.assistant { margin-right: auto; align-items: flex-start; }
    .bubble { padding: 12px 16px; border-radius: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; font-size: 15px; }
    .message.user .bubble { background: #1a3a5c; color: white; border-bottom-right-radius: 4px; }
    .message.assistant .bubble { background: #1a1a24; color: #d4a574; border: 1px solid #2a2a3a; border-bottom-left-radius: 4px; }
    
    .perception { font-size: 12px; color: #888; margin-top: 4px; font-style: italic; }
    .input-area { padding: 12px 16px; background: #12121a; border-top: 1px solid #222; display: flex; gap: 8px; }
    .input-area input { flex: 1; padding: 12px; background: #1a1a24; border: 1px solid #333; border-radius: 8px; color: white; font-size: 15px; }
    .input-area button { padding: 12px 24px; background: #d4a574; color: #0a0a0f; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; font-weight: bold; }
    .input-area button:disabled { opacity: 0.5; }
    .new-session-btn { padding: 6px 12px; background: #2a2a3a; color: #888; border: none; border-radius: 6px; font-size: 12px; cursor: pointer; }
    .terminal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
    .terminal-overlay h2 { color: #d4a574; font-size: 24px; margin-bottom: 20px; }
    .terminal-stats { color: #888; font-size: 14px; line-height: 2; text-align: center; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="chat-header">
    <div class="header-left">
      <h1>夜谈 · 苏轼</h1>
      <div class="typing-status" id="typingStatus">对方正在输入...</div>
    </div>
    <div style="display:flex; gap:10px; align-items:center;">
      <!-- 去掉了执念值，把“新的一局”改成了“清空对话” -->
      <button class="new-session-btn" onclick="startNewSession()">清空对话</button>
      <button class="new-session-btn" onclick="location.href='member.html'">返回</button>
    </div>
  </div>
  <div class="chat-box" id="chatBox"></div>
  <div class="input-area">
    <input type="text" id="input" placeholder="发消息..." onkeydown="if(event.key==='Enter')sendMessage()">
    <button id="sendBtn" onclick="sendMessage()">发送</button>
  </div>
  <div id="terminalOverlay" class="terminal-overlay hidden">
    <h2>对方已离线。</h2>
    <div class="terminal-stats" id="terminalStats"></div>
    <br>
    <button class="new-session-btn" onclick="restart()" style="padding:12px 24px; font-size:16px;">重新开始</button>
  </div>

  <script>
    const API_BASE = "https://1502956590-kn3mzt8tfh.ap-nanjing.tencentscf.com";  
    const TEAM_API = "https://1502956590-0kdly2qr1v.ap-nanjing.tencentscf.com";

    const token = localStorage.getItem("xh_token");
    const userId = localStorage.getItem("xh_user") ? JSON.parse(localStorage.getItem("xh_user")).username : "guest";

    let history = [];
    let behavior = { pause_before_send: 0, delete_count: 0, rewrite_count: 0, focus_blur_count: 0, typing_speed: 0, text_length: 0, first_char_delay: 0 };
    let inputStartTime = null;
    let firstCharTime = null;
    let deleteCount = 0;
    let focusBlurCount = 0;

    if (!token) {
      alert("请先前往 member.html 登录");
      location.href = "member.html";
    }

    const chatBox = document.getElementById("chatBox");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const typingStatus = document.getElementById("typingStatus");

    input.addEventListener("focus", () => { inputStartTime = Date.now(); });
    input.addEventListener("blur", () => { if (input.value.length > 0) focusBlurCount++; });
    input.addEventListener("keydown", (e) => {
      if (inputStartTime && !firstCharTime) firstCharTime = Date.now();
      if (e.key === "Backspace" || e.key === "Delete") deleteCount++;
    });

    function addMessage(role, content, perception) {
      const div = document.createElement("div");
      div.className = "message " + role;
      let html = `<div class="bubble">${escapeHtml(content)}</div>`;
      if (perception) html += `<div class="perception">${escapeHtml(perception)}</div>`;
      div.innerHTML = html;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    function escapeHtml(text) {
      if (text === undefined || text === null) return "……";
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    async function loadHistory() {
      try {
        const res = await fetch(TEAM_API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "my_chat_history", data: {}, token })
        });
        const r = await res.json();
        if (r.history && r.history.length > 0) {
          chatBox.innerHTML = "";
          history = [];
          r.history.forEach(m => {
            if (m.role !== "user" && m.role !== "assistant") return;
            addMessage(m.role, m.content);
            history.push({ role: m.role, content: m.content });
          });
          localStorage.setItem("chat_history_" + userId, JSON.stringify(history));
          return;
        }
      } catch (e) {
        console.error("服务器历史拉取失败", e);
      }
      const raw = localStorage.getItem("chat_history_" + userId);
      if (raw) {
        try {
          const h = JSON.parse(raw);
          h.forEach(m => {
            addMessage(m.role, m.content);
            history.push(m);
          });
        } catch (e) { }
      }
    }

    function saveHistory(role, content) {
      history.push({ role, content });
      localStorage.setItem("chat_history_" + userId, JSON.stringify(history));
    }

    function startNewSession() {
      if (!confirm("确定要清空当前对话，重新开始吗？")) return;
      input.value = "新的一局";
      sendMessage();
    }

    function restart() {
      document.getElementById("terminalOverlay").classList.add("hidden");
      input.value = "新的一局";
      sendMessage();
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      behavior = {
        pause_before_send: inputStartTime ? Date.now() - inputStartTime : 0,
        delete_count: deleteCount,
        rewrite_count: 0,
        focus_blur_count: focusBlurCount,
        typing_speed: inputStartTime ? Math.round((text.length / Math.max(Date.now() - inputStartTime, 1)) * 1000) : 0,
        text_length: text.length,
        first_char_delay: firstCharTime && inputStartTime ? firstCharTime - inputStartTime : 0
      };

      addMessage("user", text);
      saveHistory("user", text);
      input.value = "";
      inputStartTime = null;
      firstCharTime = null;
      deleteCount = 0;
      focusBlurCount = 0;
      sendBtn.disabled = true;

      // ★ 显示微信级“对方正在输入”
      typingStatus.style.display = "block";

      try {
        const response = await fetch(API_BASE, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            messages: [{ role: "user", content: text }],
            token: token,
            behavior: behavior
          })
        });

        const data = await response.json();
        
        if (!response.ok) {
           throw new Error(data.error || `请求失败(${response.status})`);
        }

        if (data.state === "terminal") {
          document.getElementById("terminalStats").innerHTML = `
            对方已结束对话。
          `;
          document.getElementById("terminalOverlay").classList.remove("hidden");
          saveHistory("assistant", "……");
          addMessage("assistant", "……");
        } else {
          if (!data.reply) throw new Error("后端返回空数据");
          addMessage("assistant", data.reply, data.perception);
          saveHistory("assistant", data.reply);
        }
      } catch (err) {
        addMessage("assistant", `[系统提示] ${err.message}`);
      } finally {
        typingStatus.style.display = "none";
        sendBtn.disabled = false;
        input.focus();
      }
    }

    loadHistory();
  </script>
</body>
</html>
