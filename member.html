<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星环终端 - 工作台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f5f5; color: #333;
           -webkit-tap-highlight-color: rgba(0,0,0,0); }
    .header { background: #1F2A44; color: white; padding: 20px; text-align: center; }
    .header h1 { font-size: 20px; margin-bottom: 4px; }
    .header p { font-size: 13px; opacity: 0.8; }
    .container { max-width: 500px; margin: 0 auto; padding: 16px; }
    .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .card h2 { font-size: 16px; margin-bottom: 14px; color: #1F2A44; }
    
    /* 菜单按钮 */
    .menu-btn { display: block; width: 100%; padding: 16px; margin-bottom: 12px; background: #1F2A44; color: white; border: none; border-radius: 12px; font-size: 17px; cursor: pointer; text-align: left; }
    .menu-btn small { display: block; font-size: 12px; opacity: 0.8; margin-top: 4px; }
    .menu-btn.secondary { background: #0066cc; }
    .menu-btn.green { background: #2e7d32; }
    .menu-btn.admin { background: #dc3545; }
    
    /* 登录表单 */
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; }
    .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; }
    .btn { width: 100%; padding: 14px; background: #1F2A44; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
    .tabs { display: flex; border-bottom: 2px solid #eee; margin-bottom: 16px; }
    .tab { flex: 1; text-align: center; padding: 14px; cursor: pointer; color: #666; border-bottom: 2px solid transparent; margin-bottom: -2px; font-size: 16px; user-select: none; }
    .tab.active { color: #1F2A44; border-bottom-color: #1F2A44; font-weight: bold; background: #eef1f7; }
    .hidden { display: none !important; }
    
    /* KPI 任务列表（内嵌） */
    .task-item { padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
    .task-item:last-child { border-bottom: none; }
    .task-title { font-size: 14px; font-weight: bold; color: #333; margin-bottom: 4px; display: flex; justify-content: space-between; }
    .task-priority { font-size: 10px; padding: 2px 6px; border-radius: 4px; }
    .p0 { background: #ffe4e6; color: #c0392b; }
    .p1 { background: #fff3cd; color: #b8860b; }
    .task-deadline { font-size: 12px; color: #999; margin-bottom: 6px; }
    .task-deadline.overdue { color: #dc3545; font-weight: bold; }
    .task-status { display: flex; align-items: center; gap: 8px; }
    .badge { font-size: 11px; padding: 2px 8px; border-radius: 8px; white-space: nowrap; }
    .badge.pending { background: #ffe4e6; color: #c0392b; }
    .badge.submitted { background: #fff3cd; color: #b8860b; }
    .badge.approved { background: #d4edda; color: #27ae60; }
    .mini-track { flex: 1; background: #f0f0f0; height: 5px; border-radius: 3px; overflow: hidden; }
    .mini-fill { height: 100%; }
    .submit-btn { width: 100%; padding: 8px; margin-top: 6px; background: #1F2A44; color: white; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; }
    
    /* 提交弹层 */
    .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 100; padding: 20px; }
    .modal { background: white; border-radius: 12px; padding: 20px; width: 100%; max-width: 400px; }
    .modal h3 { font-size: 16px; margin-bottom: 14px; color: #1F2A44; }
    .modal textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; min-height: 100px; font-family: inherit; }
    .modal-actions { display: flex; gap: 10px; margin-top: 14px; }
    .modal-actions button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; }
    .btn-cancel { background: #eee; color: #666; }
    .btn-confirm { background: #1F2A44; color: white; }
    
    /* 团队看板（简化版） */
    .member-progress { margin-bottom: 12px; }
    .member-name { font-size: 14px; font-weight: bold; margin-bottom: 4px; }
    .member-bar { background: #e0e0e0; height: 8px; border-radius: 4px; overflow: hidden; }
    .member-fill { height: 100%; background: #1F2A44; border-radius: 4px; }
    .empty { color: #999; text-align: center; padding: 20px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>星环终端</h1>
    <p id="userInfo">团队工作台</p>
  </div>

  <div class="container">
    <!-- 登录区 -->
    <div id="loginSection" class="card">
      <h2>成员登录</h2>
      <div class="tabs">
        <div class="tab active" onclick="switchTab(this, 'login')">登录</div>
        <div class="tab" onclick="switchTab(this, 'register')">首次注册</div>
      </div>
      
      <div id="loginForm">
        <div class="form-group">
          <label>账号</label>
          <input type="text" id="loginUsername" placeholder="用户名">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="loginPassword" placeholder="密码">
        </div>
        <button class="btn" onclick="login()">登录</button>
      </div>

      <div id="registerForm" class="hidden">
        <div class="form-group">
          <label>邀请码</label>
          <input type="text" id="regInvite" placeholder="团队码 xh001 / 测试码 test001">
        </div>
        <div class="form-group">
          <label>显示名（选填）</label>
          <input type="text" id="regDisplayName" placeholder="例如：小明同学">
        </div>
        <div class="form-group">
          <label>设置账号</label>
          <input type="text" id="regUsername" placeholder="用户名（英文）">
        </div>
        <div class="form-group">
          <label>设置密码</label>
          <input type="password" id="regPassword" placeholder="密码">
        </div>
        <button class="btn" onclick="register()">注册并登录</button>
      </div>
    </div>

    <!-- 主功能区（登录后显示） -->
    <div id="mainSection" class="hidden">
      
      <!-- 快捷入口 -->
      <div class="card">
        <button class="menu-btn" onclick="location.href='chat.html'">
          与苏轼对话
          <small>AI 历史角色互动</small>
        </button>
        <button class="menu-btn green" onclick="copyCalendarLink()">
          📅 订阅 KPI 每日提醒
          <small>复制链接到日历 App</small>
        </button>
        <button class="menu-btn admin hidden" id="adminBtn" onclick="location.href='admin.html'">
          管理后台
          <small>分配 KPI、查看对话记录</small>
        </button>
        <button class="btn" onclick="logout()" style="background: #666; margin-top: 8px;">退出登录</button>
      </div>

      <!-- 我的 KPI（内嵌） -->
      <div class="card">
        <h2>📋 我的 KPI</h2>
        <div id="myTasks"><div class="empty">加载中...</div></div>
      </div>

      <!-- 团队进度（内嵌，外部账号隐藏） -->
      <div class="card" id="teamBoardCard">
        <h2>📊 团队进度</h2>
        <div id="teamProgress"><div class="empty">加载中...</div></div>
      </div>

    </div>
  </div>

  <!-- 提交成果弹层 -->
  <div id="submitModal" class="modal-mask hidden">
    <div class="modal">
      <h3 id="modalTaskTitle">提交成果</h3>
      <textarea id="submitContent" placeholder="简单描述完成情况"></textarea>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">取消</button>
        <button class="btn-confirm" onclick="doSubmit()">提交</button>
      </div>
    </div>
  </div>

  <script>
    // ★★★ teamApi 地址（保持你现有的，别动）★★★
    const TEAM_API = "https://1502956590-0kdly2qr1v.ap-nanjing.tencentscf.com";
    let token = localStorage.getItem("xinghuan_token");
    let userRole = localStorage.getItem("xinghuan_role");
    let userDept = localStorage.getItem("xinghuan_dept");

    function switchTab(el, tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
      document.getElementById('registerForm').classList.toggle('hidden', tab !== 'register');
    }

    async function api(action, data) {
      const res = await fetch(TEAM_API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action, data, token })
      });
      return await res.json();
    }

    async function login() {
      const r = await api("login", {
        username: document.getElementById("loginUsername").value,
        password: document.getElementById("loginPassword").value
      });
      if (r.error) { alert(r.error); return; }
      
      token = r.token;
      userRole = r.role;
      localStorage.setItem("xinghuan_token", token);
      localStorage.setItem("xinghuan_role", userRole);
      localStorage.setItem("xinghuan_name", r.name);
      localStorage.setItem("xinghuan_dept", r.department);
      
      showMain(r.name, r.role, r.department);
    }

    async function register() {
      const r = await api("register", {
        username: document.getElementById("regUsername").value,
        password: document.getElementById("regPassword").value,
        invite_code: document.getElementById("regInvite").value,
        display_name: document.getElementById("regDisplayName").value
      });
      if (r.error) { alert(r.error); return; }
      
      token = r.token;
      userRole = r.role;
      localStorage.setItem("xinghuan_token", token);
      localStorage.setItem("xinghuan_role", userRole);
      localStorage.setItem("xinghuan_name", r.name);
      localStorage.setItem("xinghuan_dept", r.department);
      
      showMain(r.name, r.role, r.department);
    }

    function showMain(name, role, dept) {
      document.getElementById("loginSection").classList.add("hidden");
      document.getElementById("mainSection").classList.remove("hidden");
      document.getElementById("userInfo").textContent = `${name} | 星环终端`;
      
      // 外部测试账号隐藏团队看板
      if (dept === "外部测试") {
        document.getElementById("teamBoardCard").classList.add("hidden");
      }
      if (role === "admin") {
        document.getElementById("adminBtn").classList.remove("hidden");
      }
      
      loadMyTasks();
      if (dept !== "外部测试") loadTeamProgress();
    }

    // ===== 我的 KPI =====
    const STATUS_MAP = {
      pending:   { label: "待办",   percent: 0,   color: "#dc3545" },
      submitted: { label: "待审核", percent: 50,  color: "#ffc107" },
      approved:  { label: "已完成", percent: 100, color: "#28a745" }
    };
    let currentTaskId = null;

    async function loadMyTasks() {
      const r = await api("my_tasks", {});
      const box = document.getElementById("myTasks");
      if (r.error) { box.innerHTML = `<div class="empty">${r.error}</div>`; return; }
      
      const tasks = r.tasks || [];
      if (tasks.length === 0) { box.innerHTML = '<div class="empty">暂无 KPI 任务</div>'; return; }
      
      const now = new Date();
      box.innerHTML = tasks.map(t => {
        const s = STATUS_MAP[t.status] || STATUS_MAP.pending;
        const hasValidDeadline = t.deadline && !isNaN(new Date(t.deadline));
        const overdue = hasValidDeadline && new Date(t.deadline) < now && t.status !== "approved";
        const deadlineText = hasValidDeadline
          ? (overdue ? `已逾期（${new Date(t.deadline).toLocaleString()}）` : `截止：${new Date(t.deadline).toLocaleString()}`)
          : "未设置截止时间";
        
        return `
          <div class="task-item">
            <div class="task-title">
              <span>${escapeHtml(t.title)}</span>
              <span class="task-priority ${t.priority === "P0" ? "p0" : "p1"}">${escapeHtml(t.priority)}</span>
            </div>
            <div class="task-deadline ${overdue ? "overdue" : ""}">${deadlineText}</div>
            <div class="task-status">
              <span class="badge ${t.status}">${s.label}</span>
              <div class="mini-track"><div class="mini-fill" style="width:${s.percent}%; background:${s.color}"></div></div>
            </div>
            ${t.status === "pending" ? `<button class="submit-btn" onclick="openModal('${t.id}', '${escapeHtml(t.title)}')">提交成果</button>` : ""}
          </div>
        `;
      }).join("");
    }

    function openModal(taskId, title) {
      currentTaskId = taskId;
      document.getElementById("modalTaskTitle").textContent = `提交成果：${title}`;
      document.getElementById("submitContent").value = "";
      document.getElementById("submitModal").classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("submitModal").classList.add("hidden");
      currentTaskId = null;
    }

    async function doSubmit() {
      const content = document.getElementById("submitContent").value.trim();
      if (!content) { alert("请填写完成情况"); return; }
      const r = await api("submit_task", { task_id: currentTaskId, content });
      if (r.error) { alert(r.error); return; }
      alert("已提交，等待管理员审核");
      closeModal();
      loadMyTasks();
    }

    // ===== 团队进度 =====
    async function loadTeamProgress() {
      const r = await api("team_progress", {});
      const box = document.getElementById("teamProgress");
      if (r.error) { box.innerHTML = `<div class="empty">${r.error}</div>`; return; }
      
      const members = r.members || [];
      if (members.length === 0) { box.innerHTML = '<div class="empty">暂无成员</div>'; return; }
      
      box.innerHTML = members.map(m => {
        let totalPercent = 100;
        if (m.tasks.length > 0) {
          const sum = m.tasks.reduce((acc, t) => acc + (STATUS_MAP[t.status] || STATUS_MAP.pending).percent, 0);
          totalPercent = Math.round(sum / m.tasks.length);
        }
        const doneCount = m.tasks.filter(t => t.status === "approved").length;
        return `
          <div class="member-progress">
            <div class="member-name">${escapeHtml(m.name)} <small style="color:#999; font-weight:normal">${doneCount}/${m.tasks.length} 完成</small></div>
            <div class="member-bar"><div class="member-fill" style="width:${totalPercent}%; background:${totalPercent === 100 ? "#28a745" : "#1F2A44"}"></div></div>
          </div>
        `;
      }).join("");
    }

    async function copyCalendarLink() {
      token = localStorage.getItem("xinghuan_token");
      if (!token) { alert("请先登录"); return; }
      const link = TEAM_API + "/?token=" + token;
      try {
        await navigator.clipboard.writeText(link);
        alert("订阅链接已复制！\n\n粘贴到手机/电脑日历 App 的"订阅日历"里即可。");
      } catch (e) {
        prompt("复制下面的链接，粘贴到日历 App 里订阅：", link);
      }
    }

    function logout() {
      localStorage.clear();
      location.reload();
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    // 自动登录
    if (token) {
      api("my_tasks", {}).then(r => {
        if (!r.error) {
          const name = localStorage.getItem("xinghuan_name") || "成员";
          const dept = localStorage.getItem("xinghuan_dept") || "";
          showMain(name, userRole, dept);
        } else {
          localStorage.clear();
        }
      });
    }

    if (location.hash === "#register") {
      const tabs = document.querySelectorAll('.tab');
      if (tabs.length >= 2) switchTab(tabs[1], 'register');
    }
  </script>
</body>
</html>
