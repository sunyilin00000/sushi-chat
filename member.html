<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星环终端 - 工作台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f5f5; color: #333;
           -webkit-tap-highlight-color: rgba(0,0,0,0); }
    .header { background: #1F2A44; color: white; padding: 20px; text-align: center; }
    .header h1 { font-size: 20px; margin-bottom: 4px; }
    .header p { font-size: 13px; opacity: 0.8; }
    .container { max-width: 500px; margin: 0 auto; padding: 20px; }
    .card { background: white; border-radius: 12px; padding: 24px; margin-top: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .menu-btn { display: block; width: 100%; padding: 20px; margin-bottom: 16px; background: #1F2A44; color: white; border: none; border-radius: 12px; font-size: 18px; cursor: pointer; text-align: left; transition: all 0.3s; }
    .menu-btn:hover { background: #2a3a5c; transform: translateY(-2px); }
    .menu-btn.secondary { background: #0066cc; }
    .menu-btn.secondary:hover { background: #0052a3; }
    .menu-btn.green { background: #2e7d32; }
    .menu-btn.green:hover { background: #1b5e20; }
    .menu-btn.admin { background: #dc3545; }
    .menu-btn.admin:hover { background: #b02a37; }
    .menu-btn small { display: block; font-size: 13px; opacity: 0.8; margin-top: 4px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; }
    .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; }
    .btn { width: 100%; padding: 14px; background: #1F2A44; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
    .tabs { display: flex; border-bottom: 2px solid #eee; margin-bottom: 16px; }
    .tab { flex: 1; text-align: center; padding: 16px 12px; cursor: pointer; color: #666;
           border-bottom: 2px solid transparent; margin-bottom: -2px; font-size: 16px;
           user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    .tab.active { color: #1F2A44; border-bottom-color: #1F2A44; font-weight: bold;
                  background: #eef1f7; border-radius: 8px 8px 0 0; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="header">
    <h1>星环终端</h1>
    <p id="userInfo">团队工作台</p>
  </div>

  <div class="container">
    <div id="loginSection" class="card">
      <h2 style="margin-bottom: 16px; color: #1F2A44;">成员登录</h2>
      <div class="tabs">
        <div class="tab active" onclick="switchTab(this, 'login')">登录</div>
        <div class="tab" onclick="switchTab(this, 'register')">首次注册</div>
      </div>
      
      <div id="loginForm">
        <div class="form-group">
          <label>账号</label>
          <input type="text" id="loginUsername" placeholder="用户名">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="loginPassword" placeholder="密码">
        </div>
        <button class="btn" onclick="login()">登录</button>
      </div>

      <div id="registerForm" class="hidden">
        <div class="form-group">
          <label>邀请码</label>
          <input type="text" id="regInvite" placeholder="团队码 xh001 / 测试码 test001">
        </div>
        <div class="form-group">
          <label>显示名（选填，测试账号填写）</label>
          <input type="text" id="regDisplayName" placeholder="例如：小明同学">
        </div>
        <div class="form-group">
          <label>设置账号</label>
          <input type="text" id="regUsername" placeholder="用户名（英文）">
        </div>
        <div class="form-group">
          <label>设置密码</label>
          <input type="password" id="regPassword" placeholder="密码">
        </div>
        <button class="btn" onclick="register()">注册并登录</button>
      </div>
    </div>

    <div id="menuSection" class="hidden">
      <div class="card">
        <h2 style="margin-bottom: 20px; color: #1F2A44;">选择功能</h2>
        
        <button class="menu-btn" onclick="goChat()">
          与苏轼对话
          <small>AI 历史角色互动（内部测试）</small>
        </button>
        
        <!-- 团队看板入口：外部测试账号登录时由 JS 隐藏 -->
        <button class="menu-btn" id="teamBoardBtn" style="background:#6a3fb5;" onclick="goTeamBoard()">
          📊 团队 KPI 看板
          <small>查看所有人的任务和完成进度</small>
        </button>
        
        <button class="menu-btn secondary" onclick="goTasks()">
          我的 KPI
          <small>查看任务、提交成果、同步日历</small>
        </button>
        
        <button class="menu-btn green" onclick="copyCalendarLink()">
          📅 订阅 KPI 每日提醒
          <small>点我复制链接，粘贴到手机/电脑日历 App，每天自动提醒</small>
        </button>
        
        <button class="menu-btn admin hidden" id="adminBtn" onclick="goAdmin()">
          管理后台
          <small>分配 KPI、查看对话记录（仅管理员）</small>
        </button>
        
        <button class="btn" onclick="logout()" style="margin-top: 20px; background: #666;">退出登录</button>
      </div>
    </div>
  </div>

  <script>
    // ★★★ teamApi 访问地址（保持你上次改好的，别动）★★★
    const TEAM_API = "https://1502956590-0kdly2qr1v.ap-nanjing.tencentscf.com";
    let token = localStorage.getItem("xinghuan_token");
    let userRole = localStorage.getItem("xinghuan_role");
    let userDept = localStorage.getItem("xinghuan_dept");

    function switchTab(el, tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
      document.getElementById('registerForm').classList.toggle('hidden', tab !== 'register');
    }

    async function api(action, data) {
      const res = await fetch(TEAM_API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action, data, token })
      });
      return await res.json();
    }

    async function login() {
      const r = await api("login", {
        username: document.getElementById("loginUsername").value,
        password: document.getElementById("loginPassword").value
      });
      if (r.error) { alert(r.error); return; }
      
      token = r.token;
      userRole = r.role;
      localStorage.setItem("xinghuan_token", token);
      localStorage.setItem("xinghuan_role", userRole);
      localStorage.setItem("xinghuan_name", r.name);
      localStorage.setItem("xinghuan_dept", r.department);
      
      showMenu(r.name, r.role, r.department);
    }

    async function register() {
      const r = await api("register", {
        username: document.getElementById("regUsername").value,
        password: document.getElementById("regPassword").value,
        invite_code: document.getElementById("regInvite").value,
        display_name: document.getElementById("regDisplayName").value
      });
      if (r.error) { alert(r.error); return; }
      
      token = r.token;
      userRole = r.role;
      localStorage.setItem("xinghuan_token", token);
      localStorage.setItem("xinghuan_role", userRole);
      localStorage.setItem("xinghuan_name", r.name);
      localStorage.setItem("xinghuan_dept", r.department);
      
      showMenu(r.name, r.role, r.department);
    }

    function showMenu(name, role, dept) {
      document.getElementById("loginSection").classList.add("hidden");
      document.getElementById("menuSection").classList.remove("hidden");
      document.getElementById("userInfo").textContent = `${name} | 星环终端`;
      
      if (dept === "外部测试") {
        document.getElementById("teamBoardBtn").classList.add("hidden");
      }
      if (role === "admin") {
        document.getElementById("adminBtn").classList.remove("hidden");
      }
    }

    function goChat() { window.location.href = "chat.html"; }
    function goTeamBoard() { window.location.href = "team.html"; }
    // 【改】直接跳转到真正的 KPI 页面
    function goTasks() { window.location.href = "tasks.html"; }
    function goAdmin() { window.location.href = "admin.html"; }

    async function copyCalendarLink() {
      token = localStorage.getItem("xinghuan_token");
      if (!token) { alert("请先登录"); return; }
      const link = TEAM_API + "/?token=" + token;
      try {
        await navigator.clipboard.writeText(link);
        alert("订阅链接已复制！\n\n粘贴到手机/电脑日历 App 的"订阅日历"里即可。\n\n注意：每次重新登录后需要重新复制一次。");
      } catch (e) {
        prompt("复制下面的链接，粘贴到日历 App 里订阅：", link);
      }
    }

    function logout() {
      localStorage.clear();
      location.reload();
    }

    if (token) {
      api("my_tasks", {}).then(r => {
        if (!r.error) {
          const name = localStorage.getItem("xinghuan_name") || "成员";
          const dept = localStorage.getItem("xinghuan_dept") || "";
          showMenu(name, userRole, dept);
        } else {
          localStorage.clear();
        }
      });
    }

    if (location.hash === "#register") {
      const tabs = document.querySelectorAll('.tab');
      if (tabs.length >= 2) switchTab(tabs[1], 'register');
    }
  </script>
</body>
</html>
