<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星环终端 · 线上会议</title>
    <style>
        :root {
            --gold: #c9a227; --gold-bright: #e8cd6a; --gold-dim: #8a7320;
            --bg: #070709; --panel: #101014; --panel2: #16161c; --line: #2b2b33;
            --text: #d9d9de; --muted: #7d7d88; --orange: #ff9a1f;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
               background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .top-bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
                   padding: 12px 22px; background: var(--panel); border-bottom: 1px solid var(--gold-dim); }
        .brand { font-size: 18px; letter-spacing: 6px; color: var(--gold-bright); font-weight: 600; }
        .brand-en { font-size: 10px; letter-spacing: 4px; color: var(--muted); margin-left: 12px; text-transform: uppercase; }
        .room-label { font-size: 12px; letter-spacing: 2px; color: var(--muted); margin-left: 20px; }
        .room-label b { color: var(--gold); font-size: 14px; }
        .ctrl-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
        .ctrl-buttons button { background: transparent; border: 1px solid var(--gold-dim); color: var(--gold);
                               padding: 7px 16px; font-size: 12px; letter-spacing: 2px; cursor: pointer; transition: all .2s; font-family: inherit; }
        .ctrl-buttons button:hover { background: var(--gold); color: #000; }
        .ctrl-buttons button.solid { background: var(--gold); color: #000; border-color: var(--gold); }
        .ctrl-buttons button.alert { border-color: #8a3a2a; color: #d98a6a; }
        .ctrl-buttons button.alert:hover { background: #8a3a2a; color: #fff; }
        .ctrl-buttons button.recording { background: #8a3a2a; border-color: #8a3a2a; color: #fff; }
        .main-row { flex: 1; display: flex; min-height: 0; }
        #stage { flex: 1; position: relative; display: flex; flex-direction: column; min-width: 0; }
        #bigscreen { height: 52%; min-height: 220px; background: #000; display: none; border-bottom: 1px solid var(--gold-dim); }
        #screen-share-view { width: 100%; height: 100%; }
        #remote-videos { flex: 1; display: flex; flex-wrap: wrap; gap: 12px; padding: 16px;
                         align-content: flex-start; justify-content: center; overflow-y: auto; }
        /* ★ 成员格子：可点击切大流，右上角禁言按钮 */
        .remote-cell { width: 300px; height: 225px; background: #000; border: 1px solid var(--line);
                       cursor: pointer; position: relative; }
        .mute-btn { position: absolute; top: 6px; right: 6px; z-index: 10; padding: 3px 10px; font-size: 11px;
                    letter-spacing: 1px; background: rgba(0,0,0,0.7); border: 1px solid var(--gold-dim);
                    color: var(--gold); cursor: pointer; font-family: inherit; }
        .mute-btn:hover { background: var(--gold); color: #000; }
        .mute-btn.muted { background: #8a3a2a; border-color: #8a3a2a; color: #fff; }
        #vote-mask { display: none; position: absolute; inset: 0; background: rgba(4,4,6,0.93); z-index: 50;
                     align-items: center; justify-content: center; text-align: center; padding: 40px; }
        .mask-frame { max-width: 640px; border: 1px solid var(--gold-dim); padding: 40px 50px; background: var(--panel); }
        .mask-frame h2 { color: var(--gold-bright); letter-spacing: 4px; font-size: 22px; margin-bottom: 18px; }
        .mask-sub { font-size: 15px; color: var(--text); line-height: 2; letter-spacing: 1px; }
        #subtitle-bar { position: absolute; left: 50%; transform: translateX(-50%); bottom: 18px;
                        width: 85%; max-width: 900px; z-index: 40; text-align: center; pointer-events: none; }
        .sub-line { display: inline-block; background: rgba(0,0,0,0.78); border-left: 2px solid var(--gold);
                    padding: 7px 16px; margin-top: 6px; font-size: 16px; letter-spacing: 1px; animation: subfade 8s forwards; }
        @keyframes subfade { 0% {opacity:0;} 8% {opacity:1;} 80% {opacity:1;} 100% {opacity:0;} }
        .local-box { position: fixed; left: 18px; bottom: 18px; width: 200px; height: 150px; background: #000;
                     border: 1px solid var(--gold-dim); z-index: 60; }
        #chatPanel { width: 320px; border-left: 1px solid var(--gold-dim); background: var(--panel);
                     display: flex; flex-direction: column; flex-shrink: 0; position: relative; }
        #chatPanel.collapsed { width: 0; border: none; overflow: hidden; }
        .chat-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px;
                       border-bottom: 1px solid var(--line); font-size: 12px; letter-spacing: 3px; color: var(--gold); }
        .chat-header button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 12px; }
        #chatList { flex: 1; overflow-y: auto; padding: 12px; }
        .chat-msg { font-size: 13px; line-height: 1.7; margin-bottom: 10px; word-break: break-all; }
        .chat-msg .chat-who { color: var(--gold); font-weight: 600; }
        .chat-msg.me .chat-who { color: var(--gold-bright); }
        .chat-msg.sushi { border-left: 2px solid var(--gold-dim); padding-left: 8px; }
        .chat-msg.sys { color: var(--muted); font-size: 11px; letter-spacing: 1px; }
        .chat-msg .at { color: var(--orange); font-weight: 700; }
        #btnSushiSpeak { margin: 0 12px 8px; padding: 8px; background: transparent; border: 1px solid var(--gold-dim);
                         color: var(--gold); font-size: 12px; letter-spacing: 3px; cursor: pointer; font-family: inherit; }
        #btnSushiSpeak:hover { background: var(--gold); color: #000; }
        .chat-input-row { display: flex; border-top: 1px solid var(--line); }
        #chatInput { flex: 1; padding: 12px; background: var(--panel2); border: none; outline: none;
                     color: var(--text); font-size: 13px; font-family: inherit; }
        #btnSendChat { padding: 0 18px; background: var(--gold); border: none; color: #000; font-weight: 600;
                       letter-spacing: 2px; cursor: pointer; font-size: 13px; font-family: inherit; }
        #atDropdown { display: none; position: absolute; bottom: 96px; left: 12px; right: 12px; max-height: 170px;
                      overflow-y: auto; background: var(--panel2); border: 1px solid var(--gold-dim); z-index: 120; }
        #atDropdown div { padding: 9px 12px; font-size: 13px; cursor: pointer; letter-spacing: 1px; }
        #atDropdown div:hover, #atDropdown div.active { background: var(--gold); color: #000; }
        #atDropdown .ai-tag { color: var(--gold-dim); font-size: 11px; margin-left: 8px; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: none;
                 align-items: center; justify-content: center; z-index: 100; }
        .modal-content { background: var(--panel); border: 1px solid var(--gold-dim); width: 92%; max-width: 460px;
                         padding: 26px; max-height: 85vh; overflow-y: auto; }
        .modal-content h3 { margin-bottom: 18px; color: var(--gold-bright); letter-spacing: 4px; font-size: 16px; }
        .modal input[type=text] { width: 100%; padding: 10px; margin-bottom: 10px; background: var(--panel2);
                                  border: 1px solid var(--line); color: var(--text); font-family: inherit; outline: none; }
        .modal input[type=text]:focus { border-color: var(--gold-dim); }
        .opt-item { display: block; padding: 11px 14px; background: var(--panel2); border: 1px solid var(--line);
                    margin-bottom: 8px; cursor: pointer; font-size: 14px; }
        .opt-item:hover { border-color: var(--gold); }
        .modal .btn { width: 100%; padding: 12px; border: none; cursor: pointer; margin-top: 8px; color: #000;
                      background: var(--gold); font-size: 14px; letter-spacing: 3px; font-family: inherit; }
        .modal .btn:hover { background: var(--gold-bright); }
        .vote-count { font-size: 13px; color: var(--muted); margin-top: 12px; line-height: 2; white-space: pre-line; }
        #fileList .file-item { display: flex; justify-content: space-between; align-items: center; padding: 9px 12px;
                               background: var(--panel2); margin-bottom: 6px; font-size: 13px; }
        #fileList .file-item button { padding: 4px 12px; font-size: 12px; border: 1px solid var(--gold-dim);
                                      background: none; color: var(--gold); cursor: pointer; font-family: inherit; }
        #fileList .file-item button:hover { background: var(--gold); color: #000; }
        #boardModal .modal-content { max-width: 920px; width: 94%; height: 86vh; display: flex; flex-direction: column; }
        .board-toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .board-toolbar .tool { padding: 6px 14px; background: transparent; border: 1px solid var(--gold-dim);
                               color: var(--gold); cursor: pointer; font-size: 12px; letter-spacing: 2px; font-family: inherit; }
        .board-toolbar .tool.active { background: var(--gold); color: #000; }
        .board-toolbar input[type=color] { width: 34px; height: 30px; border: 1px solid var(--gold-dim); background: none; cursor: pointer; }
        .board-toolbar .alert { border-color: #8a3a2a; color: #d98a6a; }
        .board-toolbar .file-btn { font-size: 11px; color: var(--muted); letter-spacing: 1px; cursor: pointer; }
        .board-toolbar .file-btn input { display: none; }
        #boardWrap { flex: 1; position: relative; background: #ffffff; margin-top: 12px; overflow: hidden; }
        #boardCanvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
        #boardStatus { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.72); color: var(--gold-bright);
                       padding: 5px 12px; font-size: 12px; letter-spacing: 2px; display: none; z-index: 5; }
        .cursor-tag { position: absolute; background: rgba(0,0,0,0.75); color: var(--orange); font-size: 11px;
                      padding: 2px 8px; letter-spacing: 1px; pointer-events: none; z-index: 6; white-space: nowrap; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="top-bar">
        <div>
            <span class="brand" id="meetingName">星环会议</span>
            <span class="brand-en">XingHuan Conference</span>
            <span class="room-label">ROOM <b id="roomLabel">-</b></span>
        </div>
        <div class="ctrl-buttons">
            <button id="btnSubtitle">实时字幕</button>
            <button id="btnShare">屏幕共享</button>
            <button id="btnBoard">协同批注</button>
            <button id="btnRecord">录制</button>
            <button id="btnChatToggle">文字频道</button>
            <button class="hidden" id="btnVote">发起表决</button>
            <button class="alert hidden" id="btnMuteAll">全员禁言</button>
            <button class="hidden" id="btnUnmute">解除禁言</button>
            <button id="btnFiles">会议文件</button>
            <button class="solid" id="btnLeave">结束离开</button>
        </div>
    </div>

    <div class="main-row">
        <div id="stage">
            <div id="bigscreen"><div id="screen-share-view"></div></div>
            <div id="remote-videos"></div>
            <div id="vote-mask"><div class="mask-frame" id="voteMaskContent"></div></div>
            <div id="subtitle-bar"></div>
        </div>

        <aside id="chatPanel">
            <div class="chat-header">
                <span>会议交流 TEXT CHANNEL</span>
                <button id="btnChat">收起</button>
            </div>
            <div id="chatList"></div>
            <button id="btnSushiSpeak">请苏轼发言</button>
            <div class="chat-input-row">
                <input type="text" id="chatInput" placeholder="输入消息回车发送；@ 可出现成员名单" autocomplete="off">
                <button id="btnSendChat">发送</button>
            </div>
            <div id="atDropdown"></div>
        </aside>
    </div>

    <div class="local-box" id="local-video"></div>

    <div class="modal" id="boardModal">
        <div class="modal-content">
            <h3>协同批注 COLLABORATIVE BOARD</h3>
            <div class="board-toolbar">
                <button class="tool active" data-tool="pen">画笔</button>
                <button class="tool" data-tool="eraser">橡皮</button>
                <button class="tool" data-tool="text">文字</button>
                <input type="color" id="penColor" value="#c9a227">
                <button class="tool alert" id="btnBoardClear">清空</button>
                <button class="tool" id="btnBoardSave">保存批注</button>
                <label class="file-btn">上传底图（PPT 请另存为图片）
                    <input type="file" id="boardBgInput" accept="image/png,image/jpeg">
                </label>
            </div>
            <div id="boardWrap">
                <canvas id="boardCanvas"></canvas>
                <div id="boardStatus"></div>
            </div>
        </div>
    </div>

    <div class="modal" id="voteModal">
        <div class="modal-content">
            <h3>表决 VOTING</h3>
            <div id="voteAdminCreate" class="hidden">
                <input type="text" id="voteQ" placeholder="表决议题">
                <input type="text" id="voteOpt1" placeholder="选项一">
                <input type="text" id="voteOpt2" placeholder="选项二">
                <input type="text" id="voteOpt3" placeholder="选项三（可留空）">
                <input type="text" id="voteOpt4" placeholder="选项四（可留空）">
                <button class="btn" id="btnStartVote">发起表决</button>
            </div>
            <div id="voteParticipate" class="hidden">
                <div id="voteQuestionText" style="margin-bottom:14px;font-size:15px;letter-spacing:1px;"></div>
                <div id="voteOptions"></div>
                <button class="btn" id="btnSubmitVote">提交表决</button>
            </div>
            <div id="voteAdminPanel" class="hidden">
                <div class="vote-count" id="voteLiveCount"></div>
                <button class="btn" id="btnEndVote" style="background:#8a3a2a;color:#fff;">结束并公布结果</button>
            </div>
        </div>
    </div>

    <div class="modal" id="fileModal">
        <div class="modal-content">
            <h3>会议文件 FILES</h3>
            <div id="fileList"><p style="color:var(--muted);font-size:13px;">载入中…</p></div>
            <input type="file" id="fileInput" style="margin-top:14px;color:var(--muted);font-size:13px;">
            <button class="btn" id="btnUploadFile">上传（大文件自动分片）</button>
        </div>
    </div>

    <script>
        document.getElementById('roomLabel').innerText =
            new URLSearchParams(location.search).get('room') || '101';
    </script>
    <script src="trtc-loader.js"></script>
    <script src="meeting-boot.js"></script>
    <script src="meeting-features.js"></script>
</body>
</html>
