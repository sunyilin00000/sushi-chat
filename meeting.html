<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星环终端 - 线上会议</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
               background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; }
        .top-bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
                   padding: 10px 16px; background: #1e293b; border-bottom: 1px solid #334155; }
        .top-bar h1 { font-size: 17px; letter-spacing: 2px; }
        .room-label { font-size: 13px; color: #94a3b8; margin-left: 8px; }
        .ctrl-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
        .ctrl-buttons button { padding: 7px 12px; border: none; border-radius: 6px; font-size: 12px;
                               cursor: pointer; font-weight: bold; color: white; background: #475569; }
        .ctrl-buttons button:hover { opacity: 0.85; }
        .btn-green { background: #10b981 !important; }
        .btn-red { background: #ef4444 !important; }
        .btn-blue { background: #3b82f6 !important; }
        .btn-purple { background: #8b5cf6 !important; }
        .btn-amber { background: #f59e0b !important; }
        /* 主舞台：大屏 + 成员画面墙 + 投票遮罩都叠在这层 */
        #stage { flex: 1; position: relative; display: flex; flex-direction: column; overflow: hidden; }
        /* 屏幕共享大屏（有人共享时才显示） */
        #bigscreen { height: 52%; min-height: 220px; background: #000; display: none; border-bottom: 2px solid #334155; }
        #screen-share-view { width: 100%; height: 100%; }
        /* 远端成员画面墙 */
        #remote-videos { flex: 1; display: flex; flex-wrap: wrap; gap: 10px; padding: 12px;
                         align-content: flex-start; justify-content: center; overflow-y: auto; }
        .remote-cell { width: 300px; height: 225px; background: #000; border-radius: 8px; overflow: hidden; position: relative; }
        /* 投票遮罩：盖住整个舞台（含大屏），投票期间挡住共享内容 */
        #vote-mask { display: none; position: absolute; inset: 0; background: rgba(2,6,23,0.85);
                     z-index: 50; align-items: center; justify-content: center; text-align: center; padding: 30px; }
        #vote-mask .mask-box { max-width: 600px; }
        #vote-mask h2 { color: #38bdf8; margin-bottom: 15px; font-size: 22px; }
        #vote-mask .mask-sub { font-size: 15px; color: #cbd5e1; line-height: 1.8; }
        /* 字幕条：画面底部悬浮 */
        #subtitle-bar { position: absolute; left: 50%; transform: translateX(-50%); bottom: 16px;
                        width: 85%; max-width: 900px; z-index: 40; text-align: center; pointer-events: none; }
        .sub-line { display: inline-block; background: rgba(0,0,0,0.7); padding: 6px 14px; border-radius: 6px;
                    margin-top: 6px; font-size: 16px; animation: subfade 8s forwards; }
        @keyframes subfade { 0% {opacity:0;} 8% {opacity:1;} 80% {opacity:1;} 100% {opacity:0;} }
        /* 本地小画面 */
        .local-box { position: fixed; right: 16px; bottom: 16px; width: 200px; height: 150px; background: #000;
                     border: 2px solid #334155; border-radius: 8px; overflow: hidden; z-index: 60; }
        /* 通用弹窗 */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none;
                 align-items: center; justify-content: center; z-index: 100; }
        .modal-content { background: #1e293b; border-radius: 12px; width: 92%; max-width: 460px;
                         padding: 20px; max-height: 85vh; overflow-y: auto; }
        .modal-content h3 { margin-bottom: 15px; color: #38bdf8; }
        .modal input[type=text] { width: 100%; padding: 10px; margin-bottom: 8px; border-radius: 6px;
                                  border: 1px solid #475569; background: #0f172a; color: #e2e8f0; }
        .opt-item { display: block; padding: 10px 12px; background: #0f172a; border: 1px solid #334155;
                    border-radius: 6px; margin-bottom: 8px; cursor: pointer; font-size: 14px; }
        .opt-item:hover { border-color: #38bdf8; }
        .modal .btn { width: 100%; padding: 11px; border: none; border-radius: 6px; font-weight: bold;
                      cursor: pointer; margin-top: 8px; color: white; background: #3b82f6; font-size: 14px; }
        .vote-count { font-size: 13px; color: #94a3b8; margin-top: 10px; line-height: 1.8; }
        #fileList .file-item { display: flex; justify-content: space-between; align-items: center;
                               padding: 8px 10px; background: #0f172a; border-radius: 6px; margin-bottom: 6px; font-size: 13px; }
        #fileList .file-item button { padding: 4px 10px; font-size: 12px; border: none; border-radius: 4px;
                                      background: #10b981; color: white; cursor: pointer; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="top-bar">
        <div>
            <span style="color:#38bdf8;">星环会议</span>
            <span class="room-label">房间号：<span id="roomLabel">-</span></span>
        </div>
        <div class="ctrl-buttons">
            <button class="btn-purple" id="btnSubtitle">字幕：关</button>
            <button class="btn-blue" id="btnShare">共享屏幕</button>
            <button class="btn-amber hidden" id="btnVote">发起投票</button>
            <button class="btn-red hidden" id="btnMuteAll">全体禁言</button>
            <button class="btn-green hidden" id="btnUnmute">解除禁言</button>
            <button id="btnFiles">文件</button>
            <button id="btnLeave">离开会议</button>
        </div>
    </div>

    <!-- 主舞台：投票遮罩盖在这一层上面 -->
    <div id="stage">
        <!-- 屏幕共享大屏 -->
        <div id="bigscreen"><div id="screen-share-view"></div></div>
        <!-- 远端成员画面墙 -->
        <div class="remote-wall" id="remote-videos"></div>
        <!-- 投票遮罩 -->
        <div id="vote-mask"><div class="mask-box" id="voteMaskContent"></div></div>
        <!-- 字幕条 -->
        <div id="subtitle-bar"></div>
    </div>

    <!-- 本地摄像头画面 -->
    <div class="local-box" id="local-video"></div>

    <!-- 投票弹窗 -->
    <div class="modal" id="voteModal">
        <div class="modal-content">
            <h3 id="voteModalTitle">投票</h3>
            <div id="voteAdminCreate" class="hidden">
                <input type="text" id="voteQ" placeholder="投票问题，如：下周团建去哪？">
                <input type="text" id="voteOpt1" placeholder="选项1">
                <input type="text" id="voteOpt2" placeholder="选项2">
                <input type="text" id="voteOpt3" placeholder="选项3（可留空）">
                <input type="text" id="voteOpt4" placeholder="选项4（可留空）">
                <button class="btn" id="btnStartVote" style="background:#f59e0b;">发起投票</button>
            </div>
            <div id="voteParticipate" class="hidden">
                <div id="voteQuestionText" style="margin-bottom:12px;font-size:15px;"></div>
                <div id="voteOptions"></div>
                <button class="btn" id="btnSubmitVote">提交投票</button>
            </div>
            <div id="voteAdminPanel" class="hidden">
                <div class="vote-count" id="voteLiveCount"></div>
                <button class="btn" id="btnEndVote" style="background:#ef4444;">结束投票并公布结果</button>
            </div>
        </div>
    </div>

    <!-- 文件面板 -->
    <div class="modal" id="fileModal">
        <div class="modal-content">
            <h3>会议文件</h3>
            <div id="fileList"><p style="color:#94a3b8;font-size:13px;">加载中...</p></div>
            <input type="file" id="fileInput" style="margin-top:12px;color:#94a3b8;font-size:13px;">
            <button class="btn" id="btnUploadFile" style="background:#8b5cf6;">上传（≤700KB）</button>
        </div>
    </div>

    <script>
        document.getElementById('roomLabel').innerText =
            new URLSearchParams(location.search).get('room') || '101';
    </script>
    <script src="trtc-loader.js"></script>
    <script src="meeting-boot.js"></script>
    <script src="meeting-features.js"></script>
</body>
</html>
