<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星环终端 - 我的 KPI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f5f5; }
    .header { background: #1F2A44; color: white; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 18px; }
    .header button { background: rgba(255,255,255,0.15); color: white; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; }
    .container { max-width: 500px; margin: 0 auto; padding: 16px; }
    .card { background: white; border-radius: 12px; padding: 18px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .task-row { padding: 14px 0; border-bottom: 1px solid #f0f0f0; }
    .task-row:last-child { border-bottom: none; }
    .task-title { font-size: 15px; color: #333; font-weight: bold; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .task-priority { font-size: 11px; padding: 2px 8px; border-radius: 4px; white-space: nowrap; }
    .p0 { background: #ffe4e6; color: #c0392b; }
    .p1 { background: #fff3cd; color: #b8860b; }
    .task-desc { font-size: 13px; color: #666; line-height: 1.5; margin-bottom: 8px; }
    .task-deadline { font-size: 12px; color: #999; margin-bottom: 8px; }
    .task-deadline.overdue { color: #dc3545; font-weight: bold; }
    .task-status { display: flex; align-items: center; gap: 10px; }
    .badge { font-size: 12px; padding: 3px 10px; border-radius: 10px; white-space: nowrap; }
    .badge.pending   { background: #ffe4e6; color: #c0392b; }
    .badge.submitted { background: #fff3cd; color: #b8860b; }
    .badge.approved  { background: #d4edda; color: #27ae60; }
    .mini-track { flex: 1; background: #f0f0f0; height: 6px; border-radius: 3px; overflow: hidden; }
    .mini-fill { height: 100%; border-radius: 3px; }
    .submit-btn { width: 100%; padding: 10px; margin-top: 8px; background: #1F2A44; color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
    .submit-btn:disabled { background: #999; }
    .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 100; padding: 20px; }
    .modal { background: white; border-radius: 12px; padding: 20px; width: 100%; max-width: 400px; }
    .modal h3 { font-size: 16px; margin-bottom: 14px; color: #1F2A44; }
    .modal textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; min-height: 100px; resize: vertical; font-family: inherit; }
    .modal-actions { display: flex; gap: 10px; margin-top: 14px; }
    .modal-actions button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; }
    .btn-cancel { background: #eee; color: #666; }
    .btn-confirm { background: #1F2A44; color: white; }
    .loading { color: #999; text-align: center; padding: 40px; }
    .empty { color: #999; text-align: center; padding: 30px; font-size: 14px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="header">
    <h1>📋 我的 KPI</h1>
    <button onclick="location.href='member.html'">返回工作台</button>
  </div>
  <div class="container" id="taskList">
    <div class="loading">加载中...</div>
  </div>

  <div id="submitModal" class="modal-mask hidden">
    <div class="modal">
      <h3 id="modalTaskTitle">提交成果</h3>
      <textarea id="submitContent" placeholder="简单描述完成情况，或粘贴链接/文字说明"></textarea>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">取消</button>
        <button class="btn-confirm" onclick="doSubmit()">提交</button>
      </div>
    </div>
  </div>

  <script>
    // ★★★ teamApi 地址（和 member.html 里的一样）★★★
    const TEAM_API = "https://1502956590-0kdly2qr1v.ap-nanjing.tencentscf.com";
    const token = localStorage.getItem("xinghuan_token");

    if (!token) {
      alert("请先登录");
      location.href = "member.html";
    }

    const STATUS_MAP = {
      pending:   { label: "待办",   percent: 0,   color: "#dc3545" },
      submitted: { label: "待审核", percent: 50,  color: "#ffc107" },
      approved:  { label: "已完成", percent: 100, color: "#28a745" }
    };

    let currentTaskId = null;

    async function api(action, data) {
      const res = await fetch(TEAM_API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action, data, token })
      });
      return await res.json();
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    async function loadTasks() {
      const r = await api("my_tasks", {});
      const box = document.getElementById("taskList");

      if (r.error) {
        box.innerHTML = `<div class="loading">${escapeHtml(r.error)}</div>`;
        return;
      }

      const tasks = r.tasks || [];
      if (tasks.length === 0) {
        box.innerHTML = '<div class="empty">暂无 KPI 任务，联系管理员分配</div>';
        return;
      }

      const now = new Date();
      box.innerHTML = tasks.map(t => {
        const s = STATUS_MAP[t.status] || STATUS_MAP.pending;
        const hasValidDeadline = t.deadline && !isNaN(new Date(t.deadline));
        const overdue = hasValidDeadline && new Date(t.deadline) < now && t.status !== "approved";
        // 【修复】无截止时间时显示"未设置"，不再出现 Invalid Date
        const deadlineText = hasValidDeadline
          ? (overdue ? `已逾期（${new Date(t.deadline).toLocaleString()}）` : `截止：${new Date(t.deadline).toLocaleString()}`)
          : "未设置截止时间";

        return `
          <div class="card task-row">
            <div class="task-title">
              <span>${escapeHtml(t.title)}</span>
              <span class="task-priority ${t.priority === "P0" ? "p0" : "p1"}">${escapeHtml(t.priority)}</span>
            </div>
            ${t.description ? `<div class="task-desc">${escapeHtml(t.description)}</div>` : ""}
            <div class="task-deadline ${overdue ? "overdue" : ""}">${deadlineText}</div>
            <div class="task-status">
              <span class="badge ${t.status}">${s.label}</span>
              <div class="mini-track">
                <div class="mini-fill" style="width:${s.percent}%; background:${s.color}"></div>
              </div>
            </div>
            ${t.status === "pending" ? `<button class="submit-btn" onclick="openModal('${t.id}', '${escapeHtml(t.title)}')">提交成果</button>` : ""}
          </div>
        `;
      }).join("");
    }

    function openModal(taskId, title) {
      currentTaskId = taskId;
      document.getElementById("modalTaskTitle").textContent = `提交成果：${title}`;
      document.getElementById("submitContent").value = "";
      document.getElementById("submitModal").classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("submitModal").classList.add("hidden");
      currentTaskId = null;
    }

    async function doSubmit() {
      const content = document.getElementById("submitContent").value.trim();
      if (!content) { alert("请填写完成情况"); return; }

      const r = await api("submit_task", { task_id: currentTaskId, content });
      if (r.error) { alert(r.error); return; }

      alert("已提交，等待管理员审核");
      closeModal();
      loadTasks();
    }

    loadTasks();
  </script>
</body>
</html>
