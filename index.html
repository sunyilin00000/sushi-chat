<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星环终端 - 选择功能</title>
    <style>
        :root {
            --primary: #1e293b;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --text: #334155;
            --text-light: #64748b;
            --blue: #0f62fe;
            --red: #dc2626;
            --gray: #52525b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        
        /* 顶部深色导航 */
        .header {
            width: 100%;
            background-color: var(--primary);
            height: 60px;
            margin-bottom: 40px;
        }

        .container {
            background: var(--card-bg);
            width: 90%;
            max-width: 450px;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        .title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #0f172a;
        }

        /* 按钮卡片样式 */
        .menu-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            cursor: pointer;
            border: none;
            transition: transform 0.1s, opacity 0.2s;
            text-decoration: none;
        }
        .menu-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        .menu-btn:active { transform: translateY(1px); }

        .menu-btn h3 { font-size: 18px; margin-bottom: 5px; font-weight: bold; }
        .menu-btn p { font-size: 13px; opacity: 0.8; }

        /* 颜色区分 */
        .btn-dark { background: var(--primary); color: white; }
        .btn-blue { background: var(--blue); color: white; }
        .btn-red { background: var(--red); color: white; }
        .btn-gray { background: var(--gray); color: white; text-align: center; padding: 15px; }

    </style>
</head>
<body>

    <div class="header"></div>

    <div class="container">
        <div class="title">选择功能</div>
        
        <!-- 与苏轼对话 -->
        <a href="chat.html" class="menu-btn btn-dark">
            <h3>与苏轼对话</h3>
            <p>AI 历史角色互动（内部测试）</p>
        </a>

        <!-- 我的 KPI -->
        <a href="member.html" class="menu-btn btn-blue">
            <h3>我的 KPI</h3>
            <p>查看任务、提交成果、同步日历</p>
        </a>

        <!-- 管理后台 -->
        <a href="admin.html" class="menu-btn btn-red">
            <h3>管理后台</h3>
            <p>分配 KPI、查看对话记录（仅管理员）</p>
        </a>

        <!-- 退出登录 -->
        <button onclick="handleLogout()" class="menu-btn btn-gray">
            退出登录
        </button>
    </div>

    <script>
        // 退出登录逻辑
        function handleLogout() {
            // 清除之前存储的登录状态（对应 member.html 里的 key）
            localStorage.removeItem('xh_token');
            localStorage.removeItem('xh_user');
            
            // 你可以选择跳回登录页，或者留在这里。这里给个提示并刷新
            alert("已退出登录");
            window.location.reload();
        }
    </script>
</body>
</html>
